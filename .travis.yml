language: node_js
node_js:
- '0.10'
addons:
  chrome: stable
  apt:
    packages:
    - php-cli
script:
- npm test
- PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:8000 -t . > /tmp/php-server.log 2>&1 &
- nvm install 20
- mkdir -p /tmp/qunit-runner && cd /tmp/qunit-runner && npm install --no-audit --no-fund puppeteer-core@22.15.0 && cd "$TRAVIS_BUILD_DIR"
- NODE_PATH=/tmp/qunit-runner/node_modules node test/run-browser-tests.cjs http://127.0.0.1:8000/test/index.html
