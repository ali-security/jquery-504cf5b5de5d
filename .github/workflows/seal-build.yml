# Sealed build: build-and-pack only. The test suite runs on Travis
# (.travis.yml); this workflow rebuilds dist/ with the project's own grunt
# build, generates the dist/cdn copies with build/release.js, and packs the
# npm tarball.
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NPM_CONFIG_REGISTRY: https://:2014-05-01T18%3A05%3A32.863Z@time-machines-npm.sealsecurity.io/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '0.10'

      - name: Install dependencies
        run: |
          node --version
          npm --version
          npm install

      # grunt stamps the build date into dist/jquery.js ("Date:") and the year
      # into the dist/jquery.min.js banner; run it at the release timestamp so
      # the rebuilt dist matches the published one.
      - name: Install libfaketime
        run: sudo apt-get update -qq && sudo apt-get install -y -qq faketime

      - name: Build (grunt)
        env:
          TZ: UTC
          FAKETIME: "@2014-05-01 17:42:10"
          FAKETIME_DONT_FAKE_MONOTONIC: "1"
        run: LD_PRELOAD=/usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1 ./node_modules/.bin/grunt

      # Upstream's release script generates dist/cdn/* (makeReleaseCopies) before
      # npm publish; reuse its generateArtifacts with grunt already run above.
      - name: Generate dist/cdn release copies
        run: |
          npm install shelljs@0.2.6
          node -e '
            var R = { newVersion: require("./package.json").version, preRelease: false,
              exec: function() {}, define: function( o ) { R.def = o; } };
            require("./build/release.js")( R );
            R.def.generateArtifacts(function( files ) { console.log( "release artifacts:", files ); });
          '
          ls -la dist dist/cdn

      - name: Pack
        run: |
          rm -rf .github
          npm pack
          tar tzf jquery-*.tgz

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: jquery-*.tgz
          if-no-files-found: error
